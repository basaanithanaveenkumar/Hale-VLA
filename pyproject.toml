[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-vla"
version = "0.1.0"
description = "Vision-Language Assistant model implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["vla", "vision", "language", "model", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "datasets>=4.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "opencv-python>=4.13.0.92",
    "matplotlib>=3.10.8",
    "loguru>=0.7.3",
    # Halos-lift (import name `lifting`): pure-PyTorch BEV / TPV lifting for the BEV scene tokens.
    "halos-lift",
    "torchcodec>=0.11.1",
    "decord>=0.6.0",
    "av>=17.0.1",
    "setuptools>=82.0.0",
    "tensorboard>=2.20.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "nvitop>=1.7.0",
    # Shared core: config schemas/loader, registries and the HaleCoreError hierarchy.
    "hale-blocks",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.8",
    "mypy>=1.4.0",
    "isort>=5.12.0",
    "pre-commit>=4.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
# Ray Train launcher (scripts/train.py --ray) and WebDataset shards (--webdataset), from HaleBlocks.
ray = ["hale-blocks[ray]"]
webdataset = ["hale-blocks[webdataset]"]
distributed = ["hale-blocks[ray,webdataset]"]
# Pretrained LLM decoder (--llm_backbone): registry, LoRA (transformers + peft) from HaleBlocks.
finetune = ["hale-blocks[finetune]"]
# YAML run configs (scripts/train.py --config): HaleBlocks' pydantic schemas + YAML loader.
config = ["hale-blocks"]
# Deployment (hale-vla-deploy): HaleBlocks' hale_core.deploy + ONNX / ONNX Runtime.
deploy = [
    "hale-blocks[deploy]",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "loguru>=0.7",
]
# NVIDIA: TensorRT 10/11 + ModelOpt (AutoCast / PTQ). Build engines on the target GPU.
deploy-nvidia = [
    "halo-vla[deploy]",
    "tensorrt>=10.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-modelopt[onnx]>=0.40; sys_platform == 'linux'",
]
# Apple Silicon: MLX (ATen -> MLX bridge, .mlxfn export).
deploy-apple = [
    "halo-vla[deploy]",
    "mlx>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# AMD: Quark for the Ryzen AI NPU (MIGraphX ships with ROCm, not on PyPI).
deploy-amd = [
    "halo-vla[deploy]",
    "amd-quark>=0.10",
]
# Qualcomm: AI Hub client (cloud compile / profile on Snapdragon devices).
deploy-qualcomm = [
    "halo-vla[deploy]",
    "qai-hub>=0.30",
]

[project.scripts]
hale-vla-deploy = "Halo_VLA.deploy.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/halo-vla"
Repository = "https://github.com/yourusername/halo-vla.git"
Documentation = "https://halo-vla.readthedocs.io"
Issues = "https://github.com/yourusername/halo-vla/issues"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["config*", "dataloader*", "Halo_VLA*", "Halo_VLA.models*", "Halo_VLA.deploy*", "tests*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=models --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.uv.sources]
hale-blocks = { git = "https://github.com/basaanithanaveenkumar/HaleBlocks.git" }
halos-lift = { git = "https://github.com/basaanithanaveenkumar/Halos-lift" }
