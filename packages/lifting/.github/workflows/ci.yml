name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch)
        run: |
          uv venv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,vision]"
      - name: Lint
        run: uv run --no-sync ruff check src tests examples && uv run --no-sync ruff format --check src tests examples
      - name: Unit, lifting, integration and training tests
        run: uv run --no-sync pytest -m "not slow" -q

  verify:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"
      - name: Verify every lifting technique on synthetic 3D scenes
        run: uv run --no-sync lifting-verify --gif verification.gif --json verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            verification.gif
            verification.json
