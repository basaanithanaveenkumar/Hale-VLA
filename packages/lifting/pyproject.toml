[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lifting"
version = "0.1.0"
description = "Pure-PyTorch 2D -> 3D / BEV lifting for robotics and autonomous driving (TPVFormer, BEVFormer, Lift-Splat, Simple-BEV, TIIM) with multi-scale deformable attention and a synthetic-scene verifier."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Naveen Kumar Basaanitha" }]
keywords = ["bev", "tpvformer", "bevformer", "lift-splat-shoot", "deformable-attention", "autonomous-driving", "robotics", "occupancy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
vision = ["torchvision>=0.16"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
lifting-verify = "lifting.cli:main"

[project.urls]
Repository = "https://github.com/basaanithanaveenkumar/lifting"

[tool.hatch.build.targets.wheel]
packages = ["src/lifting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running training / verification tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
