name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch, HaleBlocks config + finetune extras, Halos-lift)
        run: |
          uv venv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[config,finetune]" pytest
      - name: Test suite (offline, CPU)
        run: .venv/bin/python -m pytest tests -q -o addopts=""
